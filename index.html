<body>
	<div class="wrapper">
		<header>
			<h1>
				<a href="https://github.com/ManuelVargas1251">Manuel Vargas</a>
			</h1>

			<!-- Mobile Hamburger Toggle Button -->
			<button class="nav-toggle" type="button" aria-label="Toggle Navigation" aria-expanded="false" aria-controls="site-nav">
				<span class="hamburger-box" aria-hidden="true">
					<span class="hamburger-line"></span>
					<span class="hamburger-line"></span>
					<span class="hamburger-line"></span>
				</span>
			</button>

			<!-- Navigation bar -->
			<nav class="site-nav" id="site-nav">
				<a href="/#" title="Home" aria-label="Home"><span class="nav-icon" aria-hidden="true">🏠</span><span class="nav-label">Home</span></a>
				<span class="nav-divider" aria-hidden="true">|</span>
				<a href="https://github.com/ManuelVargas1251" target="_blank" rel="noopener noreferrer" title="Projects" aria-label="Projects"><span class="nav-icon" aria-hidden="true">📚</span><span class="nav-label">Projects</span></a>
				<span class="nav-divider" aria-hidden="true">|</span>
				<a href="mailto:contact@mnl.space" title="Contact" aria-label="Contact"><span class="nav-icon" aria-hidden="true">✉️</span><span class="nav-label">Contact</span></a>
			</nav>
			<script src="js/colorchange.js"></script>
		</header>
		<!-- 
		<section>
			main body here 
		</section>
		-->
		<footer>
			<p>
				<small>website update coming soon</small>
			</p>
		</footer>
	</div>
	<div class="theme-toy" id="theme-toy">
		<button class="theme-toy-btn" type="button" aria-label="Choose day theme" aria-expanded="false"></button>
	</div>

	<!-- Persistent Bottom Audio Player Bar -->
	<aside class="audio-player-bar" role="region" aria-label="Audio Player">
		<div class="audio-player-container">
			
			<!-- Track Title / Status Display -->
			<div class="audio-track-info">
				<span class="audio-indicator" aria-hidden="true">🎵</span>
				<div class="audio-track-text">
					<span class="audio-label">Now Playing</span>
					<span class="audio-title" id="player-track-title"></span>
				</div>
			</div>

			<!-- HTML5 Native Controls -->
			<div class="audio-controls-wrapper">
				<audio id="site-audio-player" preload="none" controls></audio>
			</div>

			<!-- Manual Source Toggles & Visualizer Extension Slot -->
			<div class="audio-actions">
				<!-- Source Toggle Pill Buttons -->
				<div class="audio-source-toggles" role="group" aria-label="Audio Source Selection">
					<button type="button" class="audio-toggle-btn active" id="btn-src-playlist" aria-pressed="true">
						Playlist
					</button>
					<button type="button" class="audio-toggle-btn" id="btn-src-radio" aria-pressed="false">
						Radio
					</button>
				</div>

				<!-- Dedicated Visualizer Control Slot -->
				<div class="audio-visualizer-slot" id="audio-visualizer-container">
					<button type="button" class="audio-action-btn" id="visualizer-toggle-btn" title="Toggle Visualizer (Coming Soon)" aria-label="Toggle Audio Visualizer" aria-expanded="false">
						<span class="btn-icon" aria-hidden="true">📊</span>
						<span class="btn-label">Visualizer</span>
					</button>
				</div>
			</div>

		</div>
	</aside>

	<script src="js/scale.fix.js"></script>
	<script src="js/nav.js"></script>
	<script src="js/audio-player.js"></script>

</body>
