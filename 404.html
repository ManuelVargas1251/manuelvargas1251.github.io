<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="theme-color" content="#fff">
    <title>Manuel Vargas</title>

    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <!-- SPA Redirect Handler for GitHub Pages -->
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Redirect sub-paths back to index.html with ?p=/route while skipping direct 404 / root loads
        if (path && path !== '/' && path !== '/index.html' && !path.endsWith('/404.html') && !path.endsWith('/404')) {
          var cleanSearch = search ? (search.startsWith('?') ? '&' + search.slice(1) : '&' + search) : '';
          var redirectUrl = window.location.origin + '/?p=' + encodeURI(path) + cleanSearch + hash;
          window.location.replace(redirectUrl);
        }
      })();
    </script>
  </head>
<body> 
	<div class="wrapper">
		<h1><a>404</a></h1>
		Page not found<br>
		Sorry.
	</div>
    <script src="js/scale.fix.js"></script>
    <script src="js/colorchange.js"></script>
</body>
</html>
